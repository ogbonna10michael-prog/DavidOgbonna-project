<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create account — CloudVault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0a0a0f;
    --accent: #ff4f1f;
    --error: #dc2626;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--ink);
    color: white;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }
  body::before {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at 80% 30%, rgba(255,79,31,0.2), transparent 50%),
                radial-gradient(ellipse at 10% 80%, rgba(26,26,255,0.15), transparent 50%);
    pointer-events: none;
  }
  .auth-box {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 24px;
    padding: 3rem;
    width: 100%;
    max-width: 440px;
    position: relative;
    backdrop-filter: blur(20px);
    animation: slideUp 0.4s ease;
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .logo {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 1.3rem;
    margin-bottom: 2rem;
    display: block;
    text-decoration: none;
    color: white;
  }
  .logo span { color: var(--accent); }
  h1 {
    font-family: 'Syne', sans-serif;
    font-size: 2rem;
    font-weight: 800;
    margin-bottom: 0.4rem;
    letter-spacing: -0.03em;
  }
  .sub { color: rgba(255,255,255,0.5); font-size: 0.9rem; margin-bottom: 2rem; }
  .error-banner {
    background: rgba(220,38,38,0.15);
    border: 1px solid rgba(220,38,38,0.4);
    border-radius: 10px;
    padding: 0.75rem 1rem;
    margin-bottom: 1.5rem;
    font-size: 0.875rem;
    color: #fca5a5;
  }
  .field { margin-bottom: 1.2rem; }
  label { display: block; font-size: 0.8rem; font-weight: 500; color: rgba(255,255,255,0.6); margin-bottom: 0.4rem; letter-spacing: 0.05em; text-transform: uppercase; }
  input[type="text"], input[type="email"], input[type="password"] {
    width: 100%;
    padding: 0.85rem 1rem;
    background: rgba(255,255,255,0.07);
    border: 1.5px solid rgba(255,255,255,0.12);
    border-radius: 10px;
    color: white;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.95rem;
    outline: none;
    transition: border-color 0.2s;
  }
  input:focus { border-color: var(--accent); background: rgba(255,255,255,0.1); }
  input::placeholder { color: rgba(255,255,255,0.25); }
  .hint { font-size: 0.75rem; color: rgba(255,255,255,0.3); margin-top: 0.3rem; }
  .btn-submit {
    width: 100%;
    padding: 0.95rem;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 10px;
    font-family: 'Syne', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    margin-top: 0.5rem;
  }
  .btn-submit:hover { background: #e03d0f; transform: translateY(-1px); }
  .footer-link {
    text-align: center;
    margin-top: 1.5rem;
    font-size: 0.875rem;
    color: rgba(255,255,255,0.4);
  }
  .footer-link a { color: var(--accent); text-decoration: none; }
  .footer-link a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="auth-box">
  <a href="/" class="logo">Cloud<span>Vault</span></a>
  <h1>Create account</h1>
  <p class="sub">Start storing files in seconds</p>

  {% if error %}
  <div class="error-banner">⚠️ {{ error }}</div>
  {% endif %}

  <form method="POST" action="/register">
    <div class="field">
      <label>Username</label>
      <input type="text" name="username" placeholder="johndoe" required autofocus minlength="3">
      <p class="hint">Minimum 3 characters</p>
    </div>
    <div class="field">
      <label>Email</label>
      <input type="email" name="email" placeholder="you@example.com" required>
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" name="password" placeholder="••••••••" required minlength="8">
      <p class="hint">Minimum 8 characters</p>
    </div>
    <button type="submit" class="btn-submit">Create my vault →</button>
  </form>

  <div class="footer-link">
    Already have an account? <a href="/login">Sign in</a>
  </div>
</div>
</body>
</html>
